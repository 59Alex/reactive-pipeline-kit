name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25', '27']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          check-latest: true
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -PtestJavaVersion=${{ matrix.java }} --no-daemon
      - name: Verify optional ScopedValue adapter on Java 25 and 27
        if: matrix.java == '25' || matrix.java == '27'
        run: ./gradlew build -PtestJavaVersion=${{ matrix.java }} -Pjava25 --no-daemon
      - name: Verify optional JFR diagnostics on Java 27
        if: matrix.java == '27'
        run: ./gradlew build :java27:profileJava27 -PtestJavaVersion=27 -Pjava27 --no-daemon
